name: Build and Sign Glow
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-and-sign:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v5
    - uses: microsoft/setup-msbuild@v3

    - name: Build x64
      run: msbuild Glow/Glow.sln /p:Configuration=Release /p:Platform="x64" /p:OutputPath="${{ github.workspace }}\Glow\bin\x64\Release"

    - name: Build ARM64
      run: msbuild Glow/Glow.sln /p:Configuration=Release /p:Platform="ARM64" /p:OutputPath="${{ github.workspace }}\Glow\bin\arm64\Release"

    - name: Prepare unsigned
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path unsigned
        Copy-Item "Glow/bin/x64/Release/Glow.exe" "unsigned/Glow_x64.exe"
        Copy-Item "Glow/bin/arm64/Release/Glow.exe" "unsigned/Glow_arm64.exe"

    - name: Upload unsigned
      id: upload-unsigned
      uses: actions/upload-artifact@v4
      with:
        name: unsigned-glow
        path: unsigned/
        if-no-files-found: error

    - name: Sign with SignPath
      uses: signpath/github-action-submit-signing-request@v3
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        project-slug: glow
        signing-policy-slug: test-signing
        artifact-configuration-slug: glow-zip
        github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
        wait-for-completion: true
        output-artifact-directory: signed

    - name: Publish signed
      uses: actions/upload-artifact@v4
      with:
        name: Glow-Executables-Signed
        path: signed/
