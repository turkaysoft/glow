name: Build and Sign Glow

on:
  workflow_dispatch: # Trigger manually only from the Actions tab

permissions:
  contents: read

jobs:
  build-and-sign:
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v5

    # 1. Prepare MSBuild environment
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    # 2.1 x64 build
    - name: Build Glow (x64)
      run: |
        msbuild Glow/Glow.sln /p:Configuration=Release /p:Platform="x64" /p:TargetFrameworkVersion="v4.8.1" /p:OutputPath="${{ github.workspace }}\Glow\bin\x64\Release"

    # 2.2 ARM64 build
    - name: Build Glow (ARM64)
      run: |
        msbuild Glow/Glow.sln /p:Configuration=Release /p:Platform="ARM64" /p:TargetFrameworkVersion="v4.8.1" /p:OutputPath="${{ github.workspace }}\Glow\bin\arm64\Release"

    # 3.1 SignPath x64 signing (runs only if token is set)
    - name: Sign x64 Executable
      if: env.SIGNPATH_API_TOKEN != ''
      uses: SignPath/github-action-submit-signing-request@v2
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        project-slug: glow
        signing-policy-slug: release-signing
        artifact-path: Glow/bin/x64/Release/Glow.exe
        output-artifact-directory: signed/x64

    # 3.2 SignPath ARM64 signing (runs only if token is set)
    - name: Sign ARM64 Executable
      if: env.SIGNPATH_API_TOKEN != ''
      uses: SignPath/github-action-submit-signing-request@v2
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        project-slug: glow
        signing-policy-slug: release-signing
        artifact-path: Glow/bin/arm64/Release/Glow.exe
        output-artifact-directory: signed/arm64

    # 4. Prepare outputs (signed or unsigned)
    - name: Prepare Final Binaries
      id: prepare
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "final_dist"
        if (Test-Path "signed/x64/Glow.exe") {
          Copy-Item "signed/x64/Glow.exe" -Destination "final_dist/Glow_x64.exe"
        } else {
          Copy-Item "Glow/bin/x64/Release/Glow.exe" -Destination "final_dist/Glow_x64.exe"
        }

        if (Test-Path "signed/arm64/Glow.exe") {
          Copy-Item "signed/arm64/Glow.exe" -Destination "final_dist/Glow_ARM64.exe"
        } else {
          Copy-Item "Glow/bin/arm64/Release/Glow.exe" -Destination "final_dist/Glow_ARM64.exe"
        }

        if ((Test-Path "signed/x64/Glow.exe") -or (Test-Path "signed/arm64/Glow.exe")) {
          "signed=true" >> $env:GITHUB_OUTPUT
        } else {
          "signed=false" >> $env:GITHUB_OUTPUT
        }

    # 5. Upload as artifact (name changes if signed)
    - name: Upload Signed Executables
      if: steps.prepare.outputs.signed == 'true'
      uses: actions/upload-artifact@v5
      with:
        name: Glow-Executables-Signed
        path: final_dist/

    - name: Upload Unsigned Executables
      if: steps.prepare.outputs.signed != 'true'
      uses: actions/upload-artifact@v5
      with:
        name: Glow-Executables
        path: final_dist/
